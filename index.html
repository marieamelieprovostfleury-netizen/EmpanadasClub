<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Suivi des stocks</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e4e7ec;--ac:#2563eb;--g:#16a34a;--r:#dc2626;--o:#ea580c;--n:#98a2b3;--gb:#dcfce7;--rb:#fee2e2;--ob:#ffedd5;--nb:#eef0f3;--a:#d97706;--ab:#fef3c7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mu:#98a2b3;--bd:#2a2f38;--ac:#60a5fa;--g:#4ade80;--r:#f87171;--o:#fb923c;--n:#98a2b3;--gb:#12301e;--rb:#3b1517;--ob:#3a2210;--nb:#23272e;--a:#fbbf24;--ab:#3a2e0e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mu:#98a2b3;--bd:#2a2f38;--ac:#60a5fa;--g:#4ade80;--r:#f87171;--o:#fb923c;--n:#98a2b3;--gb:#12301e;--rb:#3b1517;--ob:#3a2210;--nb:#23272e;--a:#fbbf24;--ab:#3a2e0e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.role{font-size:12px;background:var(--nb);color:var(--mu);padding:3px 10px;border-radius:99px}
nav{display:flex;gap:6px;margin-bottom:14px}nav button{flex:1;padding:10px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
select,input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input.q{font-size:28px;text-align:center;font-weight:600}
textarea{min-height:150px;font:13px ui-monospace,Menlo,monospace}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:6px 12px;border-radius:99px;border:2px solid transparent;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--tx)}
.g{background:var(--gb);color:var(--g)}.r{background:var(--rb);color:var(--r)}.o{background:var(--ob);color:var(--o)}.n{background:var(--nb);color:var(--n)}
.it{border-left:6px solid var(--n)}.it.g{border-color:var(--g)}.it.r{border-color:var(--r)}.it.o{border-color:var(--o)}
.it{background:var(--card);color:var(--tx)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.sub{font-size:13px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;font-size:14px}
.grid b{display:block;font-size:12px;color:var(--mu);font-weight:400}
.msg{margin-top:8px;font-size:14px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--g);color:#fff;padding:12px;border-radius:12px;text-align:center;font-weight:600}
.err{color:var(--r)}
.x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:top}td:first-child,th:first-child{text-align:left}th{font-size:12px;color:var(--mu);font-weight:400}
.a{background:var(--ab);color:var(--a)}.it.a{border-color:var(--a)}.row{display:flex;gap:6px;align-items:center;margin-top:8px}.row input,.row select{padding:9px;font-size:14px}.b2{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:13px;white-space:nowrap}.b2.d{color:var(--r)}
</style></head><body><div class="w" id="app"><div class="card">Chargement…</div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GL={old:"Fin de gamme",new:"Lancement"};
const LBL={r:"Rupture",a:"Rupture prévue",o:"Surstock",g:"OK",n:"Stock non relevé"};
const SH={r:"Rupture",a:"Prévue",o:"Surstock",g:"OK",n:"N/R"};
const ORD={r:0,a:1,o:2,n:3,g:4};
const DAY=864e5,TOL=7,BAC=70,ALERT_D=10,YK_OK_H=26; // Saisie masquée si la synchro Yokitup a réussi il y a moins de YK_OK_H heures
const S={stores:{},products:{},lines:{},readings:[],names:{},periods:{},obs:{},pos:{},members:[],requests:[]};
let curP="",np={name:"",end:"",launch:"",copy:true},nProd={name:"",group:"old",m:"",store:""},nStore="",gStore="";
const pl=()=>Object.entries(S.periods).sort((a,b)=>a[1].launch<b[1].launch?-1:1);
const P=()=>Object.assign({name:"",end:"2026-11-30",launch:"2026-12-01",cover:1},S.periods[curP]||{});
function autoP(){const a=pl();if(!a.length){curP="";return}if(S.periods[curP])return;const lim=new Date(Date.now()-30*DAY).toISOString().slice(0,10);curP=(a.find(x=>x[1].launch>=lim)||a[a.length-1])[0]}
const psel=()=>`<div class="card"><label style="margin-top:0">Période</label><select onchange="curP=this.value;render(true)">${pl().map(x=>`<option value="${esc(x[0])}" ${curP===x[0]?"selected":""}>${esc(x[1].name)}</option>`).join("")}</select></div>`;
let user,me=null,canDash=false,isOwner=false,ykOk=false,view="saisie",fStore="",fCol="",lastSig="",toast="",recent=[],busy=false,bulk={};
let sel={store:""},per="mois";
try{per=localStorage.getItem("periode")==="sem"?"sem":"mois"}catch(e){}
// Vue « par semaine » : les ventes mensuelles sont ramenées à la semaine (7 jours sur 30,44)
const WK=7/30.44,MO=28/30.44,cv=n=>per==="sem"?n*WK:n*MO,PU=()=>per==="sem"?"semaine":"mois (4 sem.)";
const MIN_MOIS=250; // palier bas par défaut (ventes par mois dans le resto) ; réglable par resto dans Gestion. En dessous : simple reliquat
const pal=st=>(S.stores[st]&&S.stores[st].min>0)?S.stores[st].min:MIN_MOIS;
// Fenêtre glissante : les 4 dernières semaines complètes retenues. Chaque nouvelle semaine retenue remplace la plus ancienne.
function wkStats(p,minMois){const MIN_SEM=(minMois||MIN_MOIS)/4,all=p.weeks.map((v,i)=>({i,start:p.first+i*7*DAY,total:v,ok:v>=MIN_SEM}));
  const used=[];for(let i=all.length-1;i>=0&&used.length<4;i--)if(all[i].ok)used.push(all[i]);
  const wk=used.length?used.reduce((a,b)=>a+b.total,0)/used.length:null,last4=p.weeks.slice(-4).reduce((a,b)=>a+b,0);
  return{all,used,nb:used.length,avg:wk==null?null:wk*4,wk,last4}}
function setPer(v){per=v;try{localStorage.setItem("periode",v)}catch(e){}render(true)}
try{sel.store=localStorage.getItem("magasin")||""}catch(e){}
const slug=s=>String(s).replace(/œ/g,"oe").replace(/Œ/g,"OE").replace(/æ/g,"ae").replace(/Æ/g,"AE").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const fd=t=>new Date(t).toLocaleDateString("fr-FR");
const fdt=t=>new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
const f1=n=>n.toFixed(1).replace(".",",");
const nm=p=>p?p.name:"?";
const fb=n=>{n=Math.max(0,Math.round(n));return "≈ "+f1(n/BAC)+(n>=2*BAC?" bacs":" bac")};
const num=s=>parseFloat(String(s).replace(/\s/g,"").replace(",","."));
const stSorted=()=>Object.entries(S.stores).sort((a,b)=>a[1].name.localeCompare(b[1].name,"fr"));

function latest(){const m={};for(const r of S.readings){const k=r.store+"__"+r.ref;if(!m[k]||r.ts>m[k].ts)m[k]=r}return m}
// Moyenne mensuelle : base saisie par le manager, corrigée par les ventes réellement constatées (baisses de stock entre relevés, 90 derniers jours)
// Produits reliés à Yokitup : ventes caisse (POS) à la place des baisses de stock ; les pertes sont suivies à part, hors calcul.
function rate(l){const k=l.store+"__"+l.ref,b=l.monthly||0,p=S.pos[k];
  // Empanada reliée à Yokitup : moyenne par mois = moyenne des 4 dernières semaines complètes retenues (≥ 25 ventes) × 4.
  // Mise à jour une fois par semaine (le lundi) : la semaine en cours n'est jamais comptée.
  if(p){const st=wkStats(p,pal(l.store)),cur=st.last4/MO;
    if(st.nb>0)return{m:st.avg/MO,obs:cur,pos:true,n1:st.nb,pal:pal(l.store)};
    return{m:b>0?b:cur,obs:cur,pos:true}}
  const o=S.obs[k];if(!o||o.days<TOL)return{m:b,obs:null};const ob=o.sold/o.days*30,w=Math.min(1,o.days/60);return{m:b>0?w*ob+(1-w)*b:ob,obs:ob}}
function calc(l,r,now,M){
  if(!r)return{c:"n",m:"Aucun relevé pour le moment."};
  const q=r.qty,C=P(),isNew=l.group==="new",L0=Date.parse(C.launch),t0=r.ts||now,st=isNew?Math.max(t0,L0):t0;
  const est=M>0?Math.max(0,q-M*Math.max(0,now-st)/(30*DAY)):q;
  const o={est:Math.round(est),cov:M>0?est/M:null,out:M>0?st+q/M*30*DAY:null,cd:M>0?Math.round(est/M*30):null};
  const dn=new Date(now),me=new Date(dn.getFullYear(),dn.getMonth()+1,1).getTime(),dim=new Date(dn.getFullYear(),dn.getMonth()+1,0).getDate(),d0=new Date(dn.getFullYear(),dn.getMonth(),dn.getDate()).getTime(),sd=Math.round(Math.max(0,me-Math.max(d0,isNew?L0:d0))/DAY);
  o.mDays=sd;o.mNeed=Math.round(M*sd/dim);o.mGap=Math.round(est-M*sd/dim);
  const we=d0+(dn.getDay()===0?1:8-dn.getDay())*DAY,wd=Math.round(Math.max(0,we-Math.max(d0,isNew?L0:d0))/DAY);
  o.wDays=wd;o.wNeed=Math.round(M*wd/dim);o.wGap=Math.round(est-M*wd/dim);
  const empty=o.est<=0;
  if(isNew){
    const need=M*C.cover,gap=Math.ceil(need-est);
    if(empty&&now>=L0){o.c="r";o.m="Rupture : produit lancé et stock à zéro."}
    else if(M===0){o.c=q>0?"g":"r";o.m=q>0?"Ventes prévues non renseignées.":"Stock à zéro."}
    else if(est<need*.8){o.c=empty?"r":"a";o.m=`Stock insuffisant pour le lancement : environ ${gap} unités à produire (${fb(gap)}).`}
    else if(est>need*1.5){o.c="o";o.m=`Stock supérieur au besoin (${Math.round(need)} unités pour ${f1(C.cover)} mois de vente).`}
    else{o.c="g";o.m="Stock adapté au lancement."}
    return o;
  }
  const T=Date.parse(C.end),left=Math.round(est-M*Math.max(0,T-now)/(30*DAY));
  if(T<=now){o.c=est>0?"o":"g";o.m=est>0?`Fin de gamme dépassée : environ ${Math.round(est)} unités restent.`:"Gamme terminée, stock écoulé.";return o}
  if(empty){o.c="r";o.m=M>0?`Rupture : stock estimé à zéro (dernier relevé : ${q}).`:"Rupture : stock à zéro.";return o}
  if(M===0){o.c="o";o.m="Aucune vente renseignée : le stock restera à la fin de gamme.";return o}
  const gap=Math.round((o.out-T)/DAY),toEnd=(T-now)/DAY;
  if(gap<-TOL){o.c="a";o.m=`Rupture estimée ${-gap} j avant la fin de gamme (≈ ${-left} unités manquantes, ${fb(-left)}).`}
  else if(o.cd<=ALERT_D&&o.cd<toEnd){o.c="a";o.m=`Rupture imminente : stock pour ≈ ${o.cd} j seulement.`}
  else if(gap>TOL){o.c="o";o.m=`≈ ${left} unités resteront après la fin de gamme (${gap} j de stock en trop).`}
  else{o.c="g";o.m="Épuisement en phase avec la fin de gamme."}
  return o;
}

function shell(body){
  const tabs=[];if(canDash)tabs.push(["dash","Tableau de bord"]);if(canSaisie())tabs.push(["saisie","Saisie"]);if(isOwner)tabs.push(["ventes","Ventes moyennes"]);if(isOwner)tabs.push(["gest","Gestion"]);
  $("#app").innerHTML=`<header><h1>Suivi des stocks <span class="sub" style="font-weight:400">v4</span></h1><span><span class="role">${isOwner?"Admin":"Manager"}</span> <button class="role" style="border:0;font:inherit;font-size:12px" onclick="logout()">Quitter</button></span></header>`+
   (tabs.length>1?`<nav>${tabs.map(t=>`<button class="${view==t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</nav>`:"")+(isOwner&&view!=="saisie"&&pl().length>1?psel():"")+body+(toast?`<div class="toast">${esc(toast)}</div>`:"");
}
function go(v){view=v;render(true)}
// Saisie : admins uniquement, et seulement si la connexion Yokitup ne fonctionne pas
const canSaisie=()=>isOwner&&!ykOk;

/* ---------- SAISIE (mise à jour groupée) ---------- */
function saisie(){
  const st=stSorted(),L=latest();
  const ps=Object.values(S.lines).filter(l=>l.store===sel.store&&l.period===curP&&S.products[l.ref]);
  if(!st.length)return `<div class="card">Aucun magasin pour l’instant.${isOwner?" Créez-en un dans l’onglet « Gestion ».":" Demandez à l’admin de configurer l’application."}</div>`;
  const b=bulk[sel.store]||{};
  const grp=g=>{const a=ps.filter(l=>l.group===g).sort((x,y)=>nm(S.products[x.ref]).localeCompare(nm(S.products[y.ref]),"fr"));
    return a.length?`<div class="sub" style="margin-top:14px"><b>${GL[g]}</b></div>`+a.map(l=>{const r=L[l.store+"__"+l.ref],v=b[l.ref]??"";
    return `<div class="row"><div style="flex:1;min-width:0">${esc(nm(S.products[l.ref]))}<div class="sub">${r?`dernier : ${r.qty} · ${fb(r.qty)}`:"aucun relevé"}</div></div><div style="width:110px"><input type="number" inputmode="numeric" min="0" step="1" placeholder="${r?r.qty:"—"}" value="${esc(v)}" style="text-align:center;font-weight:600" oninput="bq('${l.ref}',this.value,this)"><div class="sub bq" style="text-align:center">${v!==""&&!isNaN(+v)?fb(+v):""}</div></div></div>`}).join(""):""};
  return `<div class="card"><label style="margin-top:0">Magasin</label>
  <select onchange="sel.store=this.value;try{localStorage.setItem('magasin',this.value)}catch(e){}render(true)"><option value="">Choisir…</option>${st.map(s=>`<option value="${esc(s[0])}" ${sel.store===s[0]?"selected":""}>${esc(s[1].name)}</option>`).join("")}</select>
  ${sel.store?(ps.length?`<div class="sub" style="margin-top:10px">Renseignez uniquement les produits comptés : un champ <b>vide</b> laisse le stock <b>inchangé</b>. (1 bac = ${BAC} unités)</div>${grp("old")}${grp("new")}<button class="btn" onclick="save()" ${busy?"disabled":""}>Enregistrer les stocks saisis</button>`:`<div class="sub" style="margin-top:10px">Aucun produit pour ce magasin sur cette période.</div>`):""}</div>`+
  (recent.length?`<div class="card"><div class="sub">Derniers enregistrements</div>${recent.map(r=>`<div style="margin-top:6px">${esc(r)}</div>`).join("")}</div>`:"");
}
function bq(ref,v,el){(bulk[sel.store]=bulk[sel.store]||{})[ref]=v;const t=el.parentNode.querySelector(".bq");if(t)t.textContent=v!==""&&!isNaN(+v)?fb(+v):""}
async function save(){
  if(!sel.store){flash("Choisissez un magasin.");return}
  const rows=[];let bad=0;
  for(const [ref,v] of Object.entries(bulk[sel.store]||{})){
    if(String(v).trim()==="")continue;
    const q=Number(String(v).trim().replace(",","."));
    if(!Number.isInteger(q)||q<0){bad++;continue}
    rows.push({store_id:sel.store,product_id:ref,qty:q});
  }
  if(bad){flash(bad+" valeur(s) invalide(s) : entiers ≥ 0 uniquement.");return}
  if(!rows.length){flash("Aucune valeur saisie : rien n’a été modifié.");return}
  busy=true;
  try{
    await sb.from("stk_readings").insert(rows).throwOnError();
    recent.unshift(`${fdt(Date.now())} · ${S.stores[sel.store].name} : ${rows.length} produit(s) mis à jour`);recent=recent.slice(0,5);
    bulk[sel.store]={};busy=false;flash(`${rows.length} stock(s) enregistré(s) ✓ — les autres sont inchangés`);
  }catch(e){busy=false;flash("Échec de l’enregistrement. Vérifiez la connexion et réessayez.")}
}
function flash(t){toast=t;render(true);setTimeout(()=>{toast="";render(true)},2800)}

/* ---------- TABLEAU DE BORD ---------- */
function dash(){
  const now=Date.now(),L=latest(),rows=[],C=P();
  for(const l of Object.values(S.lines)){
    if(l.period!==curP)continue;const p=S.products[l.ref];if(!p)continue;const r=L[l.store+"__"+l.ref],R=rate(l);
    if(!r)continue; // empanada pas encore rentrée : on ne l’affiche pas
    rows.push({l,p,r,R,M:R.m,st:S.stores[l.store]||{name:l.store},k:calc(l,r,now,R.m)});
  }
  const base=rows.filter(x=>!fStore||x.l.store===fStore);
  const cnt={r:0,a:0,o:0,g:0,n:0};base.forEach(x=>cnt[x.k.c]++);
  const list=base.filter(x=>!fCol||x.k.c===fCol).sort((a,b)=>ORD[a.k.c]-ORD[b.k.c]||nm(a.p).localeCompare(nm(b.p),"fr"));
  const syn={};
  for(const x of base){const s=syn[x.l.ref]||(syn[x.l.ref]={p:x.p,g:x.l.group,M:0,q:0,e:0,mg:0,wg:0,n:0,t:0,c:"n",rup:0});s.t++;
    if(x.r){s.n++;s.q+=x.r.qty;s.e+=x.k.est;s.mg+=x.k.mGap;s.wg+=x.k.wGap;s.M+=x.M;if(x.k.c==="r")s.rup++;if(s.c==="n"||ORD[x.k.c]<ORD[s.c])s.c=x.k.c}}
  const sy=Object.values(syn).sort((a,b)=>ORD[a.c]-ORD[b.c]||nm(a.p).localeCompare(nm(b.p),"fr"));
  return `<div class="card"><label style="margin-top:0">Magasin</label><select onchange="fStore=this.value;render(true)"><option value="">Tous les magasins (cumul)</option>${stSorted().map(s=>`<option value="${esc(s[0])}" ${fStore===s[0]?"selected":""}>${esc(s[1].name)}</option>`).join("")}</select>
  <div class="row">${[["mois","Par mois"],["sem","Par semaine"]].map(([v,t])=>`<button class="b2" style="flex:1${per===v?";background:var(--ac);border-color:var(--ac);color:#fff":""}" onclick="setPer('${v}')">${t}</button>`).join("")}</div>
  <div class="sub" style="margin-top:8px">Fin de gamme : ${fd(C.end)}<br>Stock estimé = dernier relevé − ventes moyennes écoulées depuis. Ventes moyennes (Yokitup), par resto : moyenne des 4 dernières semaines complètes retenues ${isOwner?"(au-dessus du palier bas du resto, réglable dans Gestion)":""}, ramenée au mois (× 4). Chaque nouvelle semaine remplace la plus ancienne ; mise à jour chaque lundi.</div>
  <div class="chips">${["r","a","o","g","n"].map(c=>`<span class="chip ${c} ${fCol===c?"on":""}" onclick="fCol=fCol==='${c}'?'':'${c}';render(true)">${LBL[c]} · ${cnt[c]}</span>`).join("")}</div></div>`+

let vStore="";const REL={};
async function loadRel(st){try{const {data}=await sb.from("stk_readings").select("product_id,qty,created_at,source,user_id").eq("store_id",st).order("created_at",{ascending:false}).limit(300);REL[st]=data||[]}catch(e){REL[st]=[]}render(true)}
const fdd=t=>new Date(t).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
function ventes(){
  const stl=stSorted().filter(([id])=>Object.keys(S.pos).some(k=>k.startsWith(id+"__")));
  if(!stl.length)return `<div class="card">Aucune empanada reliée à Yokitup pour l’instant.</div>`;
  const vs=stl.some(s=>s[0]===vStore)?vStore:stl[0][0];
  if(!(vs in REL)){REL[vs]=null;loadRel(vs)}
  const items=Object.entries(S.pos).filter(([k])=>k.startsWith(vs+"__")).map(([k,p])=>({pid:k.split("__")[1],p,st:wkStats(p,pal(vs))})).filter(x=>S.products[x.pid]).sort((a,b)=>nm(S.products[a.pid]).localeCompare(nm(S.products[b.pid]),"fr"));
  const rel=REL[vs];
  const prods=[...new Set(Object.keys(S.pos).map(k=>k.split("__")[1]))].filter(id=>S.products[id]).sort((a,b)=>nm(S.products[a]).localeCompare(nm(S.products[b]),"fr"));
  const cell=(st,pid)=>{const p=S.pos[st+"__"+pid];if(!p)return `<td>—</td>`;const s=wkStats(p,pal(st));
    return s.avg!=null?`<td><b>${Math.round(s.avg)}</b><div class="sub">${Math.round(s.wk)}/sem · ${fb(s.avg).replace("≈ ","")}</div></td>`:`<td><span class="sub">prévision</span></td>`};
  const comp=`<div class="card x"><b>Comparatif des restos</b><div class="sub">Ventes moyennes par mois (4 sem.), puis par semaine et en bacs. « prévision » : aucune semaine au-dessus du palier, la prévision saisie est utilisée.</div>
  <table><tr><th>Empanada</th>${stl.map(([id,s])=>`<th>${esc(s.name)}<div class="sub">palier ${pal(id)}</div></th>`).join("")}</tr>
  ${prods.map(pid=>`<tr><td>${esc(nm(S.products[pid]))}</td>${stl.map(([id])=>cell(id,pid)).join("")}</tr>`).join("")}</table></div>`;
  return comp+`<div class="card"><label style="margin-top:0">Détail d’un magasin</label><select onchange="vStore=this.value;render(true)">${stl.map(([id,s])=>`<option value="${esc(id)}" ${vs===id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
  <div class="sub" style="margin-top:8px">Ventes caisse Yokitup par semaine complète (lundi → dimanche). Une semaine est <b>retenue</b> si elle a au moins ${Math.ceil(pal(vs)/4)} ventes dans ce resto (palier bas de ${esc(S.stores[vs].name)} : ${pal(vs)} par mois, réglable dans Gestion), sinon elle est <b>écartée</b> (simple reliquat). Ventes moyennes par mois = moyenne des <b>4 dernières semaines retenues</b> × 4 : chaque nouvelle semaine retenue remplace la plus ancienne. Mise à jour chaque lundi.</div></div>`+
  items.map(({pid,p,st})=>{const r=(rel||[]).filter(x=>x.product_id===pid).slice(0,6);
    return `<div class="card"><div class="top"><b>${esc(nm(S.products[pid]))}</b><span class="pill ${st.nb?"g":"n"}">${st.nb?st.nb+" semaine"+(st.nb>1?"s":"")+" retenue"+(st.nb>1?"s":""):"aucune semaine retenue"}</span></div>
    <div class="grid"><div><b>Ventes moyennes / mois (4 sem.)</b>${st.avg!=null?Math.round(st.avg)+` <span class="sub">${fb(st.avg)}</span>`:"— <span class=\"sub\">(prévision saisie utilisée)</span>"}</div><div><b>Par semaine</b>${st.wk!=null?Math.round(st.wk)+` <span class="sub">${fb(st.wk)}</span>`:"—"}</div></div>
    <div class="sub" style="margin-top:10px"><b>12 dernières semaines</b></div><div class="x"><table><tr><th>Semaine</th><th>Ventes</th><th></th></tr>${st.all.slice(-12).reverse().map(w=>`<tr><td>${fdd(w.start)} → ${fdd(w.start+6*DAY)}</td><td>${Math.round(w.total)}</td><td><span class="pill ${st.used.includes(w)?"g":w.ok?"o":"n"}">${st.used.includes(w)?"dans la moyenne":w.ok?"retenue (plus ancienne)":"écartée"}</span></td></tr>`).join("")}</table></div>
    <div class="sub" style="margin-top:10px"><b>Derniers relevés de stock</b></div>${rel==null?`<div class="sub">Chargement…</div>`:r.length?`<div class="x"><table><tr><th>Date</th><th>Stock</th><th>Source</th></tr>${r.map(x=>`<tr><td>${fdt(x.created_at)}</td><td>${x.qty} <span class="sub">${fb(x.qty)}</span></td><td>${x.source==="yokitup"?"Yokitup":x.source==="import"?"import":esc(S.names[x.user_id]||"collaborateur")}</td></tr>`).join("")}</table></div>`:`<div class="sub">Aucun relevé.</div>`}</div>`}).join("");
}

  <button class="btn" onclick="newP()" ${busy?"disabled":""}>Créer la période</button></div>

  <div class="sub" style="margin-top:8px">Ventes moyennes/mois = valeur de départ ; elles s’ajustent ensuite aux ventes constatées.</div>
  ${lines.map(([id,l])=>`<div class="card" style="margin:8px 0 0;padding:10px"><div class="top"><b>${esc(nm(S.products[l.ref]))}</b><button class="b2 d" onclick="delLine('${id}')">Retirer</button></div><div class="row"><select onchange="setLine('${id}','grp',this.value)"><option value="old" ${l.group==="old"?"selected":""}>Fin de gamme</option><option value="new" ${l.group==="new"?"selected":""}>Lancement</option></select><input type="number" min="0" step="1" value="${esc(l.monthly)}" onchange="setLine('${id}','monthly',num(this.value)||0)" style="max-width:110px"><span class="sub">/mois</span></div></div>`).join("")}
  <div class="card" style="margin:12px 0 0;padding:10px"><b>Ajouter un produit</b><input placeholder="Nom du produit" value="${esc(nProd.name)}" oninput="nProd.name=this.value" style="margin-top:6px">
  <div class="row"><select onchange="nProd.group=this.value"><option value="old" ${nProd.group==="old"?"selected":""}>Fin de gamme</option><option value="new" ${nProd.group==="new"?"selected":""}>Lancement</option></select><input type="number" min="0" placeholder="Ventes/mois" value="${esc(nProd.m)}" oninput="nProd.m=this.value"></div>

async function run(fn,ok){try{await fn();await loadAll();if(ok)flash(ok)}catch(e){flash("Échec : "+(e.message||"erreur"))}}
const setP=(k,v)=>run(()=>sb.from("stk_periods").update({[{name:"name",end:"end_date",launch:"launch_date",cover:"cover"}[k]]:v}).eq("id",curP).throwOnError());
async function newP(){
  if(!np.name||!np.end){flash("Renseignez le nom et la date de fin de gamme.");return}
  busy=true;const prev=curP,cv=P().cover;
  try{
    const {data:p}=await sb.from("stk_periods").insert({name:np.name,end_date:np.end,launch_date:np.launch||np.end,cover:cv}).select("id").single().throwOnError();
    if(np.copy&&prev){const ls=Object.values(S.lines).filter(l=>l.period===prev).map(l=>({period_id:p.id,store_id:l.store,product_id:l.ref,grp:l.group,monthly:l.monthly}));if(ls.length)await sb.from("stk_lines").insert(ls).throwOnError()}
    await loadAll();curP=p.id;np={name:"",end:"",launch:"",copy:true};busy=false;flash("Période créée ✓");
  }catch(e){busy=false;flash("Échec de la création de la période.")}
}
function delPeriod(){if(!confirm("Supprimer la période « "+P().name+" » et ses lignes ? Les produits et relevés restent."))return;run(async()=>{await sb.from("stk_lines").delete().eq("period_id",curP).throwOnError();await sb.from("stk_periods").delete().eq("id",curP).throwOnError();curP=""},"Période supprimée ✓")}
async function addStore(){const n=nStore.trim();if(!n)return;nStore="";run(()=>sb.from("stk_stores").insert({name:n}).throwOnError(),"Magasin ajouté ✓")}
function setPal(id,v){const n=num(v);if(!(n>0)){flash("Palier invalide : nombre > 0.");return}run(()=>sb.from("stk_stores").update({min_month:n}).eq("id",id).throwOnError(),"Palier enregistré ✓")}
const renStore=(id,n)=>n.trim()&&run(()=>sb.from("stk_stores").update({name:n.trim()}).eq("id",id).throwOnError(),"Renommé ✓");
function delStore(id){if(!confirm("Supprimer le magasin « "+S.stores[id].name+" » avec ses lignes et ses relevés ?"))return;run(async()=>{for(const t of["stk_readings","stk_lines"])await sb.from(t).delete().eq("store_id",id).throwOnError();await sb.from("stk_stores").delete().eq("id",id).throwOnError()},"Magasin supprimé ✓")}
async function addProd(){
  const n=nProd.name.trim();if(!n||!curP){flash("Indiquez un nom de produit (et créez une période).");return}
  const targets=nProd.store?[nProd.store]:Object.keys(S.stores);if(!targets.length){flash("Créez d’abord un magasin.");return}
  const m=Math.max(0,num(nProd.m)||0),g=nProd.group;
  let pid;
  await run(async()=>{
    pid=(Object.entries(S.products).find(([id,p])=>slug(p.name)===slug(n))||[])[0];
    if(!pid){const {data:p}=await sb.from("stk_products").insert({key:g+"-"+slug(n)+"-"+Math.random().toString(36).slice(2,6),name:n}).select("id").single().throwOnError();pid=p.id}
    await sb.from("stk_lines").upsert(targets.map(s=>({period_id:curP,store_id:s,product_id:pid,grp:g,monthly:m})),{onConflict:"period_id,store_id,product_id"}).throwOnError();
    nProd.name="";nProd.m="";
  },"Produit ajouté ✓");
  if(pid)ykLink(pid,n);
}
// Empanada ajoutée à la période : liaison Yokitup immédiate (stock + ventes caisse), sans attendre la synchro planifiée
async function ykLink(pid,n){
  toast="Liaison de « "+n+" » avec Yokitup…";render(true);
  try{
    const {error}=await sb.functions.invoke("yokitup-sync",{body:{}});if(error)throw error;
    await loadAll();
    flash(Object.keys(S.pos).some(k=>k.endsWith("__"+pid))?"« "+n+" » reliée à Yokitup ✓":"« "+n+" » introuvable dans Yokitup (nom différent ou produit non suivi à la pièce).");
  }catch(e){flash("Liaison Yokitup impossible pour l’instant : elle sera faite à la prochaine synchro.")}
}
const setLine=(id,k,v)=>run(()=>sb.from("stk_lines").update({[k]:v}).eq("id",id).throwOnError());
const delLine=id=>run(()=>sb.from("stk_lines").delete().eq("id",id).throwOnError(),"Ligne retirée ✓");
const renProd=(id,n)=>n.trim()&&run(()=>sb.from("stk_products").update({name:n.trim()}).eq("id",id).throwOnError(),"Renommé ✓");
function delProd(id){if(!confirm("Supprimer « "+nm(S.products[id])+" » avec ses lignes et ses relevés ?"))return;run(async()=>{for(const t of["stk_readings","stk_lines"])await sb.from(t).delete().eq("product_id",id).throwOnError();await sb.from("stk_products").delete().eq("id",id).throwOnError()},"Produit supprimé ✓")}
const setRole=(id,role)=>run(()=>sb.from("stk_profiles").update({role}).eq("id",id).throwOnError(),"Droits mis à jour ✓");
function delMember(id){const m=S.members.find(x=>x.id===id);if(!m||!confirm("Révoquer l’accès de « "+(m.name||"?")+" » ?"))return;run(()=>sb.from("stk_profiles").delete().eq("id",id).throwOnError(),"Accès révoqué ✓")}
function delUser(id){const m=S.members.find(x=>x.id===id);if(!m||!confirm("Supprimer définitivement le compte de « "+(m.name||"?")+" » ?"))return;run(()=>sb.rpc("stk_delete_user",{p_id:id}).throwOnError(),"Compte supprimé ✓")}
const okReq=i=>{const r=S.requests[i];r&&run(()=>sb.rpc("stk_set_member",{p_email:r.email,p_role:"manager"}).throwOnError(),"Accès accordé ✓")};
const noReq=i=>{const r=S.requests[i];r&&run(()=>sb.from("stk_requests").delete().eq("user_id",r.user_id).throwOnError())};
async function addMember(){const e=memEmail.trim();if(!e)return;const {error}=await sb.rpc("stk_set_member",{p_email:e,p_role:"manager"});memMsg=error?"Échec : "+error.message:"Enregistré : si le compte existe, l’accès est accordé.";if(!error)memEmail="";await loadAll();render(true)}

/* ---------- Noyau ---------- */
function render(force){
  if(!sess){loginView();return}
  if((view==="gest"||view==="ventes")&&!isOwner)view="dash";if(view==="saisie"&&!canSaisie())view="dash";
  const sig=view==="saisie"?"s"+JSON.stringify([S.stores,S.lines,S.products,curP,S.readings.length]):Math.random();
  if(!force&&view==="saisie"&&sig===lastSig)return;
  lastSig=sig;
  shell(view==="dash"?dash():view==="gest"?gest():view==="ventes"?ventes():saisie());
}
let sb,sess=null,started="",loginErr="",tm,memEmail="",memMsg="";
async function loadAll(){
  for(const k in REL)delete REL[k]; // relevés de l’onglet Ventes moyennes rechargés après chaque mise à jour
  const q=t=>sb.from(t).select("*");
  const [st,pr,ln,pe]=await Promise.all([q("stk_stores"),q("stk_products"),q("stk_lines"),q("stk_periods")]);
  const bad=[st,pr,ln,pe].find(x=>x.error);
  if(bad){$("#app").innerHTML=`<div class="card err">Accès aux données impossible : ${esc(bad.error.message)}</div>`;return}
  S.stores=Object.fromEntries(st.data.map(r=>[r.id,{name:r.name,min:Number(r.min_month)||0}]));
  S.products=Object.fromEntries(pr.data.map(r=>[r.id,{name:r.name,key:r.key}]));
  S.lines=Object.fromEntries(ln.data.map(r=>[r.id,{period:r.period_id,store:r.store_id,ref:r.product_id,group:r.grp,monthly:Number(r.monthly)}]));
  S.periods=Object.fromEntries(pe.data.map(r=>[r.id,{name:r.name,end:r.end_date,launch:r.launch_date,cover:Number(r.cover)}]));
  const [rd,ob,po,ys]=await Promise.all([q("stk_latest_readings"),q("stk_obs"),q("stk_weekly"),sb.from("stk_yk_state").select("last_sync,last_error").eq("id",1).maybeSingle()]);
  S.pos=Object.fromEntries((po.data||[]).map(r=>[r.store_id+"__"+r.product_id,{weeks:(r.weeks||[]).map(Number),first:Date.parse(r.first_week+"T00:00:00")}]));
  // Stock Yokitup inchangé depuis le dernier relevé : il reste valable jusqu'à la dernière synchro
  const ls=ys.data&&ys.data.last_sync?Date.parse(ys.data.last_sync):0;
  ykOk=!!ls&&!ys.data.last_error&&Date.now()-ls<YK_OK_H*36e5;
  S.readings=(rd.data||[]).map(r=>{const ts=Date.parse(r.created_at),y=r.source==="yokitup"&&S.pos[r.store_id+"__"+r.product_id];
    return {store:r.store_id,ref:r.product_id,qty:r.qty,ts:y&&ls>ts?ls:ts,by:r.source==="import"?"import":r.source==="yokitup"?"yokitup":r.user_id}});
  S.obs=Object.fromEntries((ob.data||[]).map(r=>[r.store_id+"__"+r.product_id,{sold:Number(r.sold),days:Number(r.days)}]));
  if(isOwner){
    const [pf,rq]=await Promise.all([sb.from("stk_profiles").select("id,name,role"),q("stk_requests")]);
    S.members=pf.data||[];S.members.forEach(p=>S.names[p.id]=p.name||"Collaborateur");S.requests=rq.data||[];
  }
  autoP();render();
}
const sched=()=>{clearTimeout(tm);tm=setTimeout(loadAll,400)};
let signup=false,loginInfo="";
function loginView(){
  $("#app").innerHTML=`<div class="card"><h1 style="margin-bottom:6px">Suivi des stocks</h1><label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Mot de passe${signup?" (8 caractères minimum)":""}</label><input id="pw" type="password" autocomplete="${signup?"new-password":"current-password"}" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">${signup?"Créer mon compte":"Se connecter"}</button><div class="msg err">${esc(loginErr)}</div><div class="msg">${esc(loginInfo)}</div><div class="sub" style="margin-top:12px;text-align:center;cursor:pointer;text-decoration:underline" onclick="signup=!signup;loginErr='';loginInfo='';loginView()">${signup?"J’ai déjà un compte":"Créer un compte"}</div></div>`;
}
async function login(){
  const em=$("#em").value.trim(),pw=$("#pw").value;
  if(signup){
    if(pw.length<8){loginErr="Mot de passe trop court (8 caractères minimum).";loginView();return}
    const {data,error}=await sb.auth.signUp({email:em,password:pw});
    if(error){loginErr="Erreur : "+error.message;loginView();return}
    if(data.session)return;
    signup=false;loginErr="";loginInfo="Compte créé. Si un e-mail de confirmation vous est envoyé, cliquez sur le lien, puis connectez-vous. L’admin devra valider votre accès.";loginView();return;
  }
  const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){loginErr=/invalid login/i.test(error.message)?"E-mail ou mot de passe incorrect.":"Erreur : "+error.message;loginView()}
}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){
  me=sess.user.id;
  const {data}=await sb.from("stk_profiles").select("role").eq("id",me).maybeSingle();
  if(!data){await sb.from("stk_requests").upsert({user_id:me,email:sess.user.email},{onConflict:"user_id",ignoreDuplicates:true});$("#app").innerHTML=`<div class="card"><b>En attente de validation</b><p class="sub">Votre compte est créé. L’admin doit maintenant valider votre accès. Revenez plus tard.</p><button class="btn" onclick="logout()">Se déconnecter</button></div>`;return}
  const rl=String(data.role||"").toLowerCase();isOwner=rl==="admin";canDash=true;view="dash";
  await loadAll();
  sb.channel("rt").on("postgres_changes",{event:"*",schema:"public"},sched).subscribe();
}
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
sb.auth.onAuthStateChange((e,s)=>{sess=s;if(!s){started="";loginView();return}if(started!==s.user.id){started=s.user.id;setTimeout(start,0)}});
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
